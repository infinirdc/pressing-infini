<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infini Pressing - Hero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <section class="relative min-h-screen overflow-hidden bg-slate-950">
        <div class="absolute inset-0">
            <div class="hero-scene active absolute inset-0 bg-cover bg-center" style="background-image: linear-gradient(90deg, rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.46)), url('assets/hero_machine.png');"></div>
            <div class="hero-scene absolute inset-0 bg-cover bg-center opacity-0" style="background-image: linear-gradient(90deg, rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.46)), url('assets/hero_iron.png');"></div>
            <div class="hero-scene absolute inset-0 bg-cover bg-center opacity-0" style="background-image: linear-gradient(90deg, rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.46)), url('assets/hero_package.png');"></div>
            <div class="hero-scene absolute inset-0 bg-cover bg-center opacity-0" style="background-image: linear-gradient(90deg, rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.46)), url('assets/hero_van.png');"></div>
        </div>

        <div class="relative z-10 mx-auto flex min-h-screen max-w-6xl items-center px-6">
            <div class="max-w-3xl">
                <p class="mb-4 inline-flex rounded-full border border-white/20 bg-white/10 px-4 py-2 text-sm font-semibold text-blue-100 backdrop-blur">
                    Collecte et livraison à domicile à Kinshasa
                </p>
                <h1 class="text-4xl font-extrabold leading-tight tracking-tight text-white sm:text-5xl md:text-7xl">
                    Pressing à domicile à Kinshasa
                </h1>
                <p class="mt-6 max-w-2xl text-lg leading-relaxed text-slate-200 md:text-2xl">
                    Nous récupérons votre linge, le nettoyons avec soin et le livrons propre, repassé et prêt à porter.
                </p>
                <a href="commande.html" class="mt-9 inline-flex rounded-full bg-blue-600 px-8 py-4 text-lg font-bold text-white shadow-2xl shadow-blue-900/40 transition hover:bg-blue-500">
                    Commander via WhatsApp
                </a>
            </div>
        </div>
    </section>

    <script>
        const scenes = document.querySelectorAll('.hero-scene');
        let currentScene = 0;

        function nextScene() {
            scenes[currentScene].classList.remove('active');
            scenes[currentScene].classList.add('opacity-0');
            currentScene = (currentScene + 1) % scenes.length;
            scenes[currentScene].classList.add('active');
            scenes[currentScene].classList.remove('opacity-0');
        }

        setInterval(nextScene, 5500);
    </script>
</body>

</html>
